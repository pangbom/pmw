name: Cam capture test (one-shot)

# Manual only. Runs one capture pass into a THROWAWAY dir (not the live camstore) and reports
# diag + sizes + a timezone sanity check for the s53mv archive cams.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  camtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: One capture pass into camstore-test
        run: |
          git config user.name "pmw-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CAM_DIR=camstore-test LATEST_OUT=cams-latest-test.json DIAG_OUT=cam-diag.json node capture-cams.js
          echo "=== diag ==="; cat cam-diag.json
          echo; echo "=== sizes ==="; du -sh camstore-test/cams 2>/dev/null; du -sh camstore-test/cams/* 2>/dev/null | sort -h | tail -20
          node -e '
            const fs=require("fs"),p=require("path"); const now=Date.now(); const out={now:new Date(now).toISOString(),cams:[]};
            for(const d of fs.readdirSync("camstore-test/cams",{withFileTypes:true})){
              if(!d.isDirectory())continue;
              const fr=fs.readdirSync(p.join("camstore-test/cams",d.name)).filter(f=>/^\d+\.jpg$/.test(f)).map(f=>+f.replace(".jpg","")).sort((a,b)=>a-b);
              if(!fr.length){out.cams.push({id:d.name,frames:0});continue;}
              const nw=fr[fr.length-1],ol=fr[0];
              out.cams.push({id:d.name,frames:fr.length,newest:new Date(nw).toISOString(),ageMin:Math.round((now-nw)/60000),spanH:+((nw-ol)/3600000).toFixed(1)});
            }
            fs.writeFileSync("cam-summary.json",JSON.stringify(out,null,1)); console.log(JSON.stringify(out,null,1));'
          git add cam-diag.json cam-summary.json
          if ! git diff --staged --quiet; then git commit -m "cam probe $(date -u +%FT%TZ)"; for i in 1 2 3; do git push && break; git pull --rebase --autostash origin main || true; sleep 2; done; fi
