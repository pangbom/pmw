name: Refresh wind data

# Keeps data.json current. Runs on GitHub's own servers (open internet) so it
# needs neither Johannes's laptop nor Cowork to be open.
on:
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  schedule:
    # Every 15 min, 04:00–19:59 UTC ≈ 06:00–21:59 Bovec summer time (CEST).
    # (In winter/CET this is 05:00–20:59 local.) GitHub cron is UTC-only.
    - cron: '*/15 4-19 * * *'

# Allow the workflow to push the updated data.json back to the repo.
permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Collect observed wind -> data.json
        env:
          WU_KEY: ${{ secrets.WU_KEY }}
        run: node collector.js

      - name: Commit if data changed
        run: |
          git config user.name "pmw-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No change in data.json"
          else
            git commit -m "refresh wind data $(date -u +%FT%TZ)"
            # Push with rebase-retry so a concurrent push (e.g. a manual edit) can't fail the run.
            for i in 1 2 3 4 5; do
              if git push; then echo "pushed"; break; fi
              echo "push rejected, rebasing (attempt $i)"; git pull --rebase --autostash origin main || true
              sleep 3
            done
          fi
